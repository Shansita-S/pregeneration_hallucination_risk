services:
  - type: web
    name: hallucination-risk-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: RISK_THRESHOLD
        value: "0.60"
      - key: KNOWLEDGE_BASE_PATH
        value: data/knowledge_base.json
  - type: web
    name: hallucination-risk-mcp
    runtime: docker
    plan: free
    dockerCommand: python -m source.mcp_server
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: RISK_THRESHOLD
        value: "0.60"
      - key: KNOWLEDGE_BASE_PATH
        value: data/knowledge_base.json
